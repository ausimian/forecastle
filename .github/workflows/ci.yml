name: CI

on:
  push:
    branches: [ main, 'release/**' ]
  # No branch filter. A PR into a release integration branch has to get CI too,
  # or there is nothing for the merge gate to check.
  pull_request:

jobs:
  precommit:
    name: Precommit (Elixir 1.19 / OTP 28)
    runs-on: ubuntu-24.04

    steps:
    - name: Checkout code
      uses: actions/checkout@v5

    - name: Set up Elixir
      uses: erlef/setup-beam@v1
      with:
        elixir-version: '1.19'
        otp-version: '28'

    - name: Restore dependencies cache
      uses: actions/cache@v5
      with:
        # The fixture workspaces and the baseline and deployment scratch under
        # _build/castle are left out. The suite deletes and rebuilds every
        # release it assembles, so all a cached workspace saves is a git clone
        # and a small compile, and with one workspace per test worker (see
        # `mix test.parallel`) they add up to gigabytes of release trees.
        # `v2` retires the entries that still hold them.
        path: |
          deps
          _build
          !_build/fixtures
          !_build/castle
        key: ${{ runner.os }}-${{ runner.arch }}-mix-v2-precommit-${{ hashFiles('**/mix.lock') }}
        restore-keys: |
          ${{ runner.os }}-${{ runner.arch }}-mix-v2-precommit-

    - name: Install dependencies
      run: mix deps.get

    - name: Run precommit checks
      run: mix precommit

  test:
    name: Test on ${{ matrix.os }} (Elixir ${{ matrix.elixir }} / OTP ${{ matrix.otp }})
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
        elixir: ['1.18', '1.19', '1.20']
        otp: ['27', '28', '29']
        exclude:
          # Elixir 1.18 supports Erlang/OTP 25-27
          - elixir: '1.18'
            otp: '28'
          - elixir: '1.18'
            otp: '29'
          # Elixir 1.19 supports Erlang/OTP 26-28
          - elixir: '1.19'
            otp: '29'
          # macOS runs only the newest Elixir, against every OTP it supports.
          # GitHub runs at most five macOS jobs at once, so a sixth queued
          # until one finished and added a whole job to every run. What
          # macOS catches is the platform (bsdtar, /tmp behind a symlink, no
          # /lib), which the Elixir version does not change; the older Elixirs
          # are still covered on ubuntu.
          - os: macos-15
            elixir: '1.18'
          - os: macos-15
            elixir: '1.19'

    steps:
    - name: Checkout code
      uses: actions/checkout@v5

    - name: Set up Elixir
      uses: erlef/setup-beam@v1
      with:
        elixir-version: ${{ matrix.elixir }}
        otp-version: ${{ matrix.otp }}

    - name: Restore dependencies cache
      uses: actions/cache@v5
      with:
        # See the precommit job for what is left out, and why.
        path: |
          deps
          _build
          !_build/fixtures
          !_build/castle
        key: ${{ runner.os }}-${{ runner.arch }}-mix-v2-${{ matrix.elixir }}-${{ matrix.otp }}-${{ hashFiles('**/mix.lock') }}
        restore-keys: |
          ${{ runner.os }}-${{ runner.arch }}-mix-v2-${{ matrix.elixir }}-${{ matrix.otp }}-

    - name: Install dependencies
      run: mix deps.get

    - name: Compile
      run: mix compile --warnings-as-errors

    - name: Run tests
      # Includes the end-to-end suite, which boots a release and hot-upgrades
      # it. That is the path most sensitive to Elixir and OTP release tooling,
      # so it is worth running on every cell of the matrix.
      #
      # `test.parallel` rather than `test`: nearly every suite is synchronous,
      # so a plain `mix test` uses one core of the runner. This runs the files
      # across one `mix test` per core, each with its own fixture workspace.
      # See test/support/mix/tasks/test.parallel.ex.
      run: mix test.parallel --include e2e
